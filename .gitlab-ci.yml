# Festive Light Launch — install, test backend, build React client
stages:
  - install
  - test
  - build

default:
  image: node:20-bookworm
  interruptible: true

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
      - client/package-lock.json
  paths:
    - .npm/
    - node_modules/
    - client/node_modules/

install_deps:
  stage: install
  script:
    - npm ci

test_backend:
  stage: test
  needs:
    - install_deps
  script:
    - npm test

build_client:
  stage: build
  needs:
    - install_deps
  script:
    - npm run build
  artifacts:
    name: "client-dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - client/dist/
    expire_in: 1 week
